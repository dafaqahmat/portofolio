name: CI - Laravel Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql, sqlite, pdo_sqlite
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Install NPM dependencies & build assets
        run: |
          npm install
          npm run build

      - name: Jalankan test
        run: php artisan test

  deploy:
    name: Deploy ke server
    needs: test
    runs-on: ubuntu-latest
    # Hanya jalan kalau job "test" lolos, DAN ini push ke main
    # (bukan pull_request, biar PR dari fork tidak bisa trigger deploy)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Panggil webhook aaPanel untuk pull kode terbaru
        run: |
          curl -fsSL "${{ secrets.DEPLOY_WEBHOOK_URL }}"